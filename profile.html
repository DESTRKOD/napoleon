<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Профиль — GHETTO LUXE</title>
  <style>
    @font-face {
      font-family: 'SouthGhetto';
      src: url('SouthGhetto-Regular.woff2') format('woff2');
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'SouthGhetto', sans-serif;
      background: #000;
      color: #fff;
    }

    header {
      position: fixed;
      top: 0;
      width: 100%;
      background: rgba(0,0,0,0.95);
      padding: 20px 5%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 1000;
      border-bottom: 1px solid #333;
    }

    .logo { font-size: 2.4rem; letter-spacing: 3px; }
    nav a {
      color: #fff;
      text-decoration: none;
      margin-left: 45px;
      font-size: 1.15rem;
    }

    .profile-container {
      max-width: 1100px;
      margin: 120px auto 80px;
      padding: 0 5%;
    }

    .profile-header {
      display: flex;
      justify-content: space-between;
      background: #111;
      padding: 40px;
      margin-bottom: 60px;
      border: 1px solid #222;
    }

    .profile-info {
      font-size: 1.4rem;
    }

    .profile-info p { margin: 14px 0; }

    .edit-buttons {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .edit-btn {
      background: #fff;
      color: #000;
      border: none;
      padding: 16px 30px;
      font-family: 'SouthGhetto';
      font-size: 1.1rem;
      cursor: pointer;
    }

    .order-history {
      margin-top: 40px;
    }

    .order-item {
      display: flex;
      align-items: center;
      background: #111;
      padding: 25px;
      margin-bottom: 25px;
      border: 1px solid #222;
      position: relative;
    }

    .order-item img {
      width: 110px;
      height: 110px;
      object-fit: cover;
      margin-right: 30px;
    }

    .order-details h4 { font-size: 1.6rem; margin-bottom: 8px; }
    .order-details p { margin: 6px 0; color: #ccc; }

    .return-btn {
      position: absolute;
      top: 25px;
      right: 25px;
      background: transparent;
      border: 1px solid #fff;
      color: #fff;
      padding: 8px 20px;
      cursor: pointer;
    }

    .buy-again {
      position: absolute;
      bottom: 25px;
      right: 25px;
      background: #fff;
      color: #000;
      border: none;
      padding: 12px 32px;
      font-family: 'SouthGhetto';
      cursor: pointer;
    }
  </style>
</head>
<body>

  <header>
    <div class="logo">GHETTO LUXE</div>
    <nav>
      <a href="index.html">КАТАЛОГ</a>
      <a href="index.html#ads">О НАС</a>
      <a href="profile.html">ПРОФИЛЬ</a>
    </nav>
  </header>

  <div class="profile-container">
    <h1 style="font-size:3.5rem; margin-bottom:50px;">ПРОФИЛЬ</h1>

    <div class="profile-header">
      <div class="profile-info">
        <p><strong>Имя:</strong> Иван Купчинский</p>
        <p><strong>Номер:</strong> +7 (999) 123-45-67</p>
        <p><strong>Почта:</strong> ivan@ghettoluxe.ru</p>
        <p><strong>Дата рождения:</strong> 15.03.1998</p>
      </div>

      <div class="edit-buttons">
        <button class="edit-btn">Изменить имя</button>
        <button class="edit-btn">Изменить почту</button>
        <button class="edit-btn">Изменить номер</button>
      </div>
    </div>

    <h2 style="margin-bottom:30px; font-size:2.2rem;">История заказов</h2>

    <div class="order-history">
      <!-- Заказ 1 -->
      <div class="order-item">
        <img src="https://picsum.photos/id/1015/300/300" alt="">
        <div class="order-details">
          <h4>Товар I</h4>
          <p>Сумма: 12 900 ₽</p>
          <p>Дата: 25.03.2026</p>
        </div>
        <button class="return-btn">ВОЗВРАТ</button>
        <button class="buy-again">КУПИТЬ СНОВА</button>
      </div>

      <!-- Заказ 2 -->
      <div class="order-item">
        <img src="https://picsum.photos/id/201/300/300" alt="">
        <div class="order-details">
          <h4>Товар II</h4>
          <p>Сумма: 8 450 ₽</p>
          <p>Дата: 12.03.2026</p>
        </div>
        <button class="return-btn">ВОЗВРАТ</button>
        <button class="buy-again">КУПИТЬ СНОВА</button>
      </div>
    </div>
  </div>

</body>
</html>
