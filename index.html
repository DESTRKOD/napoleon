<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GHETTO LUXE</title>
  <script src="https://cdn.jsdelivr.net/npm/@studio-freight/lenis@1.0.42/dist/lenis.min.js"></script>
  <style>
    @font-face {
      font-family: 'SouthGhetto';
      src: url('SouthGhetto-Regular.woff2') format('woff2');
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { overflow-x: hidden; }

    body {
      font-family: 'SouthGhetto', sans-serif;
      background: #000;
      color: #fff;
      line-height: 1.4;
    }

    header {
      position: fixed;
      top: 0;
      width: 100%;
      background: rgba(0,0,0,0.97);
      padding: 18px 5%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 1000;
      transition: transform 0.5s cubic-bezier(0.23, 1, 0.32, 1);
    }

    .logo { font-size: 2.1rem; letter-spacing: 3px; }

    nav a {
      color: #fff;
      text-decoration: none;
      margin-left: 25px;
      font-size: 1.1rem;
    }

    /* Mobile menu */
    @media (max-width: 768px) {
      nav a { margin-left: 15px; font-size: 1rem; }
    }

    .hero {
      height: 100vh;
      min-height: 650px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
      position: relative;
      overflow: hidden;
    }

    .hero h1 {
      font-size: clamp(3.5rem, 10vw, 7rem);
      text-transform: uppercase;
      letter-spacing: 8px;
      opacity: 0;
      transform: scale(0.6) translateY(80px);
      transition: all 1.6s cubic-bezier(0.23, 1, 0.32, 1);
    }

    .hero.visible h1 {
      opacity: 1;
      transform: scale(1) translateY(0);
    }

    .catalog {
      padding: 100px 5% 80px;
    }

    .products {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 40px;
      max-width: 1400px;
      margin: 0 auto;
    }

    .product {
      background: #0a0a0a;
      overflow: hidden;
      border-radius: 8px;
      opacity: 0;
      transform: translateY(80px);
      transition: all 1.4s cubic-bezier(0.23, 1, 0.32, 1);
    }

    .product.visible {
      opacity: 1;
      transform: translateY(0);
    }

    .product img {
      width: 100%;
      height: 380px;
      object-fit: cover;
      transition: transform 1.2s cubic-bezier(0.23, 1, 0.32, 1);
    }

    .product:hover img,
    .product:active img {
      transform: scale(1.12);
    }

    .product-info {
      padding: 25px;
      text-align: center;
    }

    .product-info h3 { font-size: 1.65rem; margin-bottom: 12px; }
    .price { font-size: 1.95rem; margin: 15px 0; }

    .add-btn {
      background: #fff;
      color: #000;
      border: none;
      padding: 18px 40px;
      font-family: 'SouthGhetto';
      font-size: 1.2rem;
      width: 100%;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.6s cubic-bezier(0.23, 1, 0.32, 1);
      box-shadow: 0 4px 15px rgba(255,255,255,0.1);
    }

    .add-btn:hover, .add-btn:active {
      transform: translateY(-4px) scale(1.05);
      box-shadow: 0 10px 25px rgba(255,255,255,0.25);
    }

    .ads {
      padding: 80px 5% 100px;
      overflow: hidden;
    }

    .slider {
      display: flex;
      width: 300%;
      animation: slide 24s infinite linear;
    }

    .slide {
      min-width: 100%;
      height: 500px;
      background-size: cover;
      background-position: center;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .slide::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(transparent, rgba(0,0,0,0.8));
    }

    .slide-text {
      position: relative;
      z-index: 2;
      font-size: clamp(2rem, 6vw, 3.8rem);
      text-transform: uppercase;
      letter-spacing: 5px;
    }

    @keyframes slide {
      0% { transform: translateX(0); }
      33% { transform: translateX(-100%); }
      66% { transform: translateX(-200%); }
      100% { transform: translateX(-200%); }
    }

    footer {
      padding: 80px 5% 50px;
      text-align: center;
      background: #000;
    }

    @media (max-width: 768px) {
      .products { grid-template-columns: 1fr; gap: 50px; }
      .add-btn { padding: 20px; font-size: 1.25rem; }
    }
  </style>
</head>
<body>

  <header>
    <div class="logo">GHETTO LUXE</div>
    <nav>
      <a href="#catalog">КАТАЛОГ</a>
      <a href="#ads">О НАС</a>
      <a href="profile.html">ПРОФИЛЬ</a>
    </nav>
  </header>

  <section class="hero" id="home">
    <h1>WELCOME</h1>
  </section>

  <section class="catalog" id="catalog">
    <div class="products">
      <div class="product">
        <img src="https://picsum.photos/id/1015/800/800" alt="">
        <div class="product-info">
          <h3>Товар I</h3>
          <p>Описание товара...</p>
          <div class="price">12 900 ₽</div>
          <button class="add-btn">В КОРЗИНУ</button>
        </div>
      </div>
      <!-- Повтори для товара 2 и 3 -->
      <div class="product">
        <img src="https://picsum.photos/id/201/800/800" alt="">
        <div class="product-info">
          <h3>Товар II</h3>
          <p>Описание товара...</p>
          <div class="price">8 450 ₽</div>
          <button class="add-btn">В КОРЗИНУ</button>
        </div>
      </div>
      <div class="product">
        <img src="https://picsum.photos/id/237/800/800" alt="">
        <div class="product-info">
          <h3>Товар III</h3>
          <p>Описание товара...</p>
          <div class="price">24 900 ₽</div>
          <button class="add-btn">В КОРЗИНУ</button>
        </div>
      </div>
    </div>
  </section>

  <section class="ads" id="ads">
    <div class="slider">
      <div class="slide" style="background-image: url('https://picsum.photos/id/1016/1920/1080')">
        <div class="slide-text">УЛИЧНЫЙ ЛЮКС</div>
      </div>
      <div class="slide" style="background-image: url('https://picsum.photos/id/133/1920/1080')">
        <div class="slide-text">СДЕЛАНО В КУПЧИНО</div>
      </div>
      <div class="slide" style="background-image: url('https://picsum.photos/id/201/1920/1080')">
        <div class="slide-text">КАЧЕСТВО ВЫШЕ ЦЕНЫ</div>
      </div>
    </div>
  </section>

  <footer>
    <p>© 2026 GHETTO LUXE • Все права защищены</p>
  </footer>

  <script>
    // Lenis — супер-плавный скролл
    const lenis = new Lenis({
      duration: 1.6,
      easing: (t) => Math.min(1, 1.001 - Math.pow(2, -10 * t)),
      smoothWheel: true,
      smoothTouch: false // на таче оставляем нативный, но можно включить
    });

    function raf(time) {
      lenis.raf(time);
      requestAnimationFrame(raf);
    }
    requestAnimationFrame(raf);

    // Анимации появления
    const observer = new IntersectionObserver((entries) => {
      entries.forEach((entry, index) => {
        if (entry.isIntersecting) {
          setTimeout(() => {
            entry.target.classList.add('visible');
          }, index * 120);
        }
      });
    }, { threshold: 0.2, rootMargin: "0px 0px -80px 0px" });

    document.querySelector('.hero').classList.add('visible');
    document.querySelectorAll('.product').forEach(product => observer.observe(product));

    // Прячем header при скролле вниз
    let lastScroll = 0;
    lenis.on('scroll', ({ scroll }) => {
      if (scroll > lastScroll && scroll > 150) {
        document.querySelector('header').style.transform = 'translateY(-100%)';
      } else {
        document.querySelector('header').style.transform = 'translateY(0)';
      }
      lastScroll = scroll;
    });
  </script>
</body>
</html>
